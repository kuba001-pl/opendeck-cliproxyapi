name: Release

# Push a tag like v1.0.0 to build the plugin and publish it as a GitHub release.
# OpenDeck installs from the single .streamDeckPlugin asset attached here.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Check the tag matches the plugin version
        run: |
          manifest=$(node -p "require('./dev.cliproxyapi.opendeck.sdPlugin/manifest.json').Version")
          test "v$manifest" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match manifest Version $manifest"; exit 1; }
      - run: bash scripts/pack.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk -v v="${GITHUB_REF_NAME#v}" '$0 == "## " v {on=1; next} /^## / && on {exit} on' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" dist/dev.cliproxyapi.opendeck.streamDeckPlugin \
            --title "$GITHUB_REF_NAME" --notes "${notes:-See CHANGELOG.md}"
