name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: Check manifest and package versions match
        run: |
          manifest=$(node -p "require('./dev.cliproxyapi.opendeck.sdPlugin/manifest.json').Version")
          pkg=$(node -p "require('./package.json').version")
          test "$manifest" = "$pkg" || { echo "manifest.json $manifest != package.json $pkg"; exit 1; }
